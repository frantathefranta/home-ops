---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bar-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bar-assistant
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
    - name: meilisearch
      namespace: default
  values:
    externalSecrets:
      main:
        forceRename: bar-assistant-secret
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: bar-assistant-secret
          template:
            engineVersion: v2
            data:
              MEILI_MASTER_KEY: '{{.MEILI_MASTER_KEY}}'
              MEILISEARCH_KEY: '{{.MEILI_MASTER_KEY}}'
              MEILISEARCH_API_KEY: '{{.MEILISEARCH_API_KEY}}'
              MEILISEARCH_API_KEY_UID: '{{.MEILISEARCH_API_KEY_UID}}'
        dataFrom:
        - extract:
            key: /bar-assistant
    controllers:
      bar-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
        containers:
          bar-assistant:
            image:
              repository: barassistant/server
              tag: 6.10.1@sha256:19baac04e5b8db79c36797426deaf7f1e817cc081211ab92b23cc9d4a5a8131a
            env:
              BASE_URL: https://bar.franta.us
              APP_URL: https://bar.franta.us/bar
              MEILISEARCH_HOST: http://meilisearch:7700
              REDIS_HOST: bar-assistant-dragonfly.default.svc.cluster.local
              CACHE_DRIVER: redis
              SESSION_DRIVER: redis
              ALLOW_REGISTRATION: false
            envFrom:
              - secretRef:
                  name: bar-assistant-secret
            resources:
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 512M
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 10
              readiness: *probes
          nginx:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.8-alpine@sha256:03df07e5931f8374d440bd62243a5ce9b24719715ef6fc4c9c626a5f1dbef417
      salt-rim:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: barassistant/salt-rim
              tag: 5.9.0
            env:
              BASE_URL: https://bar.franta.us
              API_URL: https://bar.franta.us/bar
              MEILISEARCH_URL: https://bar.franta.us/search
              DEFAULT_LOCALE: en-US
              MAILS_ENABLED: true
            probes:
              liveness: &salt-rim-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &salt-rim-port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *salt-rim-probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    service:
      app:
        ipFamilyPolicy: PreferDualStack
        controller: *app
        ports:
          nginx:
            port: &nginx-port 3000
      salt-rim:
        ipFamilyPolicy: PreferDualStack
        controller: salt-rim
        ports:
          http:
            port: *salt-rim-port
    route:
      app:
        hostnames:
          - "bar.franta.us"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: bar-assistant-app
                port: *nginx-port

    persistence:
      app:
        existingClaim: *app
        advancedMounts:
          bar-assistant:
            bar-assistant:
              - path: /var/www/cocktails/storage/bar-assistant
                subPath: bar-assistant
      nginx-config:
        type: configMap
        name: bar-assistant-configmap
        advancedMounts:
          bar-assistant:
            nginx:
              - path: /etc/nginx/nginx.conf
                subPath: nginx-config
                readOnly: true
      memory:
        type: emptyDir
        advancedMounts:
          bar-assistant:
            nginx:
              - path: /var/cache/nginx
