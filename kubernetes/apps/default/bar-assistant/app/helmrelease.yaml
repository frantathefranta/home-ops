---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bar-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bar-assistant
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
    - name: meilisearch
      namespace: default
  values:
    controllers:
      bar-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
        containers:
          bar-assistant:
            image:
              repository: barassistant/server
              tag: 6.7.0@sha256:286d2f7d52bef72307471deb19d2daf7e0f639ad438693b022f7ebe900065184
            env:
              BASE_URL: https://bar.franta.us
              APP_URL: https://bar.franta.us/bar
              MEILISEARCH_HOST: http://meilisearch:7700
              REDIS_HOST: bar-assistant-dragonfly.default.svc.cluster.local
              CACHE_DRIVER: redis
              SESSION_DRIVER: redis
              ALLOW_REGISTRATION: false
            envFrom:
              - secretRef:
                  name: bar-assistant-secret
            resources:
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 512M
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
          nginx:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.5-alpine@sha256:19c132c9ab02d3b783f478743dafc7a7f42e27aa7d2bdcbec1bb1128ca8f2a07
      salt-rim:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: barassistant/salt-rim
              tag: 5.6.0
            env:
              BASE_URL: https://bar.franta.us
              API_URL: https://bar.franta.us/bar
              MEILISEARCH_URL: https://bar.franta.us/search
              DEFAULT_LOCALE: en-US
              MAILS_ENABLED: true
            probes:
              liveness: &salt-rim-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &salt-rim-port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *salt-rim-probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    service:
      app:
        ipFamilyPolicy: PreferDualStack
        controller: *app
        ports:
          nginx:
            port: &nginx-port 3000
      salt-rim:
        ipFamilyPolicy: PreferDualStack
        controller: salt-rim
        ports:
          http:
            port: *salt-rim-port
    route:
      app:
        hostnames:
          - "bar.franta.us"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: bar-assistant-app
                port: *nginx-port

    persistence:
      app:
        existingClaim: *app
        advancedMounts:
          bar-assistant:
            bar-assistant:
              - path: /var/www/cocktails/storage/bar-assistant
                subPath: bar-assistant
      nginx-config:
        type: configMap
        name: bar-assistant-configmap
        advancedMounts:
          bar-assistant:
            nginx:
              - path: /etc/nginx/nginx.conf
                subPath: nginx-config
                readOnly: true
      memory:
        type: emptyDir
        advancedMounts:
          bar-assistant:
            nginx:
              - path: /var/cache/nginx
