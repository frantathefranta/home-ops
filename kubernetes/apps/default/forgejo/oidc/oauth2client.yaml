---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: forgejo
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: Forgejo
  origin: https://git.franta.us
  redirectUrl:
    - https://git.franta.us/user/oauth2/kanidm/callback
  scopeMap:
    - group: idm_all_persons
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
  secretKeyAliases:
    clientId:
      - key
    clientSecret:
      - secret
