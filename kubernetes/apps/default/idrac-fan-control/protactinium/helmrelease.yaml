---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app protactinium-fan-control
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: protactinium-fan-control
  maxHistory: 2
  install:
    createNamespace: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      protactinium-fan-control:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tigerblue77/dell_idrac_fan_controller
              tag: v1.104@sha256:e92cb1d6ef1a54ecf56d588d6eefe9b3c947fcc1e07cd34a66aaf9805d4757a2
            env:
              FAN_SPEED: 15
              CPU_TEMPERATURE_THRESHOLD: 85
              CHECK_INTERAL: 60 # default
              DISABLE_THIRD_PARTY_PCIE_CARD_DELL_DEFAULT_COOLING_RESPONSE: true
            envFrom:
            - secretRef:
                name: &secret protactinium-fan-control-secret
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 100Mi
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                - talos-protactinium
