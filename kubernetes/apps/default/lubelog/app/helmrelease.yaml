---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lubelog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: lubelog
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
  values:
    externalSecrets:
      main:
        forceRename: lubelog-secret
        refreshInterval: 15m
        target:
          name: lubelog-secret
          template:
            engineVersion: v2
            data:
              OpenIDConfig__Name: Authelia
              OpenIDConfig__ClientId: lubelog
              OpenIDConfig__ClientSecret: '{{ .LUBELOG_OAUTH_CLIENT_SECRET }}'
              OpenIDConfig__AuthURL: https://auth.franta.us/api/oidc/authorization
              OpenIDConfig__TokenURL: https://auth.franta.us/api/oidc/token
              OpenIDConfig__RedirectURL: https://lubelog.franta.us/Login/RemoteAuth
              OpenIDConfig__Scope: email
              OpenIDConfig__ValidateState: 'true'
              POSTGRES_CONNECTION: Host={{ index . "pgbouncer-host" }}:{{ .port }};Username={{ .user }};Password={{ .password }};Database={{ .dbname }}
        dataFrom:
        - extract:
            key: /lubelog
          sourceRef:
            storeRef:
              kind: ClusterSecretStore
              name: akeyless-secret-store
        - extract:
            key: lubelog-pguser-lubelog
          sourceRef:
            storeRef:
              kind: SecretStore
              name: lubelog-postgres
    controllers:
      lubelog:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hargata/lubelogger
              tag: v1.7.3@sha256:c9d2bbb48c7f84d90e54496e2cd60422e56a5f2345c8a539ebe09f77e629d321
            env:
              TZ: America/Detroit
              LC_ALL: en_US.UTF-8
              LOGGING__LOGLEVEL__DEFAULT: debug
            envFrom:
              - secretRef:
                  name: lubelog-secret
            resources:
              requests:
                cpu: 15m
                memory: 80M
              limits:
                memory: 256M
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # runAsNonRoot: true
        # runAsUser: 65534
        # runAsGroup: 65534
        # seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        primary: true
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.franta.us"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      app:
        existingClaim: *app
        globalMounts:
          - path: /App/config
            subPath: config
          - path: /App/data
            subPath: data
          - path: /App/wwwroot/translations
            subPath: translations
          - path: /App/wwwroot/documents
            subPath: documents
          - path: /App/wwwroot/images
            subPath: images
          - path: /App/log
            subPath: log
          - path: /root/.aspnet/DataProtection-Keys
            subPath: keys
      tmp:
        type: emptyDir
        globalMounts:
          - path: /App/wwwroot/temp
