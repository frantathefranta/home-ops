---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lubelog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: lubelog
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
  values:
    externalSecrets:
      main:
        forceRename: lubelog-secret
        refreshInterval: 15m
        target:
          name: lubelog-secret
          template:
            engineVersion: v2
            data:
              POSTGRES_CONNECTION: Host={{ index . "pgbouncer-host" }}:{{ .port }};Username={{ .user }};Password={{ .password }};Database={{ .dbname }}
        dataFrom:
        - extract:
            key: lubelog-pguser-lubelog
          sourceRef:
            storeRef:
              kind: SecretStore
              name: lubelog-postgres
    controllers:
      lubelog:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hargata/lubelogger
              tag: v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
            env:
              TZ: America/Detroit
              LC_ALL: en_US.UTF-8
              LOGGING__LOGLEVEL__DEFAULT: debug
              OpenIDConfig__Name: Kanidm
              OpenIDConfig__ClientId:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OpenIDConfig__ClientSecret:
                valueFrom:
                  secretKeyRef:
                    name: lubelog-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              OpenIDConfig__AuthURL: https://sso.franta.us/ui/oauth2
              OpenIDConfig__TokenURL: https://sso.franta.us/oauth2/token
              OpenIDConfig__RedirectURL: https://lubelog.franta.us/Login/RemoteAuth
              OpenIDConfig__Scope: openid profile email
              OpenIDConfig__UserInfoURL: https://sso.franta.us/oauth2/openid/lubelog/userinfo
              OpenIDConfig__JwksURL: https://sso.franta.us/oauth2/openid/lubelog/public_key.jwk
              OpenIDConfig__ValidateState: "true"
              OpenIDConfig__UsePKCE: "true"
              OpenIDConfig__DisableRegistration: "true"
              OpenIDConfig__AutoGenerateTokens: "true"
              OpenIDConfig__DisableRegularLogin: "false"
            envFrom:
              - secretRef:
                  name: lubelog-secret
            resources:
              requests:
                cpu: 15m
                memory: 80M
              limits:
                memory: 256M
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        # runAsNonRoot: true
        # runAsUser: 65534
        # runAsGroup: 65534
        # seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        primary: true
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.franta.us"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      app:
        existingClaim: *app
        globalMounts:
          - path: /App/config
            subPath: config
          - path: /App/data
            subPath: data
          - path: /App/wwwroot/translations
            subPath: translations
          - path: /App/wwwroot/documents
            subPath: documents
          - path: /App/wwwroot/images
            subPath: images
          - path: /App/log
            subPath: log
          - path: /root/.aspnet/DataProtection-Keys
            subPath: keys
      tmp:
        type: emptyDir
        globalMounts:
          - path: /App/wwwroot/temp
