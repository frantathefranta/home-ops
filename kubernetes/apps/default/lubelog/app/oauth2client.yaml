---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: lubelog
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: LubeLogger
  origin: https://lubelog.franta.us
  redirectUrl:
    - https://lubelog.franta.us/Login/RemoteAuth
  scopeMap:
    - group: people
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
