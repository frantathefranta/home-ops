# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: paperless
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
  values:
    externalSecrets:
      main:
        forceRename: paperless-secret
        refreshInterval: 15m
        target:
          name: paperless-secret
          template:
            engineVersion: v2
            data:
              PAPERLESS_ADMIN_USER: '{{ .PAPERLESS_ADMIN_USER }}'
              PAPERLESS_ADMIN_PASSWORD: '{{ .PAPERLESS_ADMIN_PASSWORD }}'
              PAPERLESS_SECRET_KEY: '{{ .PAPERLESS_SECRET_KEY }}'
              PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
                {
                  "openid_connect": {
                      "APPS": [
                          {
                              "provider_id": "authelia",
                              "name": "Authelia",
                              "client_id": "{{ .PAPERLESS_OAUTH_CLIENT_ID }}",
                              "secret": "{{ .PAPERLESS_OAUTH_CLIENT_SECRET }}",
                              "settings": {
                                  "server_url": "https://auth.franta.us/"
                              }
                          }
                      ]
                  }
                }
        dataFrom:
        - extract:
            key: /paperless
          sourceRef:
            storeRef:
              kind: ClusterSecretStore
              name: akeyless-secret-store
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.2.0@sha256:22dc423ff48ac1629977dbf0c9625ba9f60d3bd1291a2ff173c65351984a14c2
            env:
              # Configure application
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_REDIS_PREFIX: pngx
              PAPERLESS_URL: https://paperless.franta.us
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: America/Detroit
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # Configure Remote User auth
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /data/remote/consume
              PAPERLESS_DATA_DIR: /data/local/data
              PAPERLESS_EXPORT_DIR: /data/remote/export
              PAPERLESS_MEDIA_ROOT: /data/local/media
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Database
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: *app
              PAPERLESS_DBHOST: paperless-pgbouncer.default.svc
              PAPERLESS_DBUSER: *app
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-pguser-paperless
                    key: password
              # Configure OCR
              PAPERLESS_OCR_LANGUAGES: eng
              PAPERLESS_OCR_LANGUAGE: eng
              # Configure redis integration
              PAPERLESS_REDIS: redis://paperless-dragonfly.default.svc.cluster.local:6379/0 # 0 is the RedisDB index
              # Configure user permissions
              USERMAP_GID: "65542"
            envFrom:
              - secretRef:
                  name: paperless-secret
            resources:
              requests:
                cpu: 15m
              limits:
                memory: 2048Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.franta.us"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /data/local
      nas:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/documents
        globalMounts:
          - path: /data/remote
