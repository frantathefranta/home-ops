---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app syncthing
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
  path: ./kubernetes/apps/default/syncthing/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
      GATUS_SUBDOMAIN: sync
      KOPIUR_CAPACITY: 5Gi
