---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tandoor
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tandoor
  maxHistory: 2
  uninstall:
    keepHistory: false
  values:
    externalSecrets:
      main:
        forceRename: tandoor-secret
        refreshInterval: 15m
        target:
          name: tandoor-secret
          template:
            engineVersion: v2
            data:
              SECRET_KEY: '{{ .TANDOOR_SECRET_KEY }}'
              SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id": "kanidm","name": "Kanidm","client_id": "{{ .KANIDM_CLIENT_ID }}","secret": "{{ .KANIDM_CLIENT_SECRET }}","settings": {"server_url": "https://sso.franta.us/oauth2/openid/tandoor/.well-known/openid-configuration","token_auth_method": "client_secret_basic","oauth_pkce_enabled": true}}]}}'
        data:
          - secretKey: KANIDM_CLIENT_ID
            remoteRef:
              key: /kanidm/tandoor
              property: CLIENT_ID
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: akeyless-secret-store
          - secretKey: KANIDM_CLIENT_SECRET
            remoteRef:
              key: /kanidm/tandoor
              property: CLIENT_SECRET
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: akeyless-secret-store
        dataFrom:
        - extract:
            key: /tandoor
          sourceRef:
            storeRef:
              kind: ClusterSecretStore
              name: akeyless-secret-store
    controllers:
      tandoor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.7.1@sha256:10e3d2cef6b4eaa24a9c548a25dc892ce70266fc888bd85d4b349eb5a7143945
            env:
              TZ: America/Detroit
              DEBUG: 0
              ALLOWED_HOSTS: "*"
              DB_ENGINE: django.db.backends.postgresql
              # Postgres
              POSTGRES_HOST: tandoor-pgbouncer.default.svc
              POSTGRES_PORT: 5432
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-pguser-recipes
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-pguser-recipes
                    key: password
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: tandoor-pguser-recipes
                    key: dbname
              DEFAULT_FROM_EMAIL: recipes@franta.dev
              GUNICORN_MEDIA: 0
              REMOTE_USER_AUTH: 0
              FRACTION_PREF_DEFAULT: 0
              COMMENT_PREF_DEFAULT: 1
              SHOPPING_MIN_AUTOSYNC_INTERVAL: 5
              ENABLE_SIGNUP: 0
              EMAIL_HOST: smtp-relay.default.svc.cluster.local
              EMAIL_PORT: 25
              SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
              # Connect Kanidm from the existing account using local login after cutover.
              SOCIALACCOUNT_ONLY: 0
              HIDE_LOGIN_FORM: 0
              SOCIALACCOUNT_AUTO_SIGNUP: 0
              SOCIALACCOUNT_EMAIL_AUTHENTICATION: 0
              SOCIALACCOUNT_EMAIL_AUTHENTICATION_AUTO_CONNECT: 0
            envFrom:
              - secretRef:
                  name: tandoor-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 1Gi
    service:
      app:
        controller: *app
        ipFamilyPolicy: RequireDualStack
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - recipes.franta.us
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/recipes/mediafiles
            subPath: mediafiles
          - path: /opt/recipes/staticfiles
            subPath: staticfiles
      temp:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: app-tmp
          - path: /opt/recipes/cookbook/static/django_js_reverse
            subPath: django_js_reverse
