---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tandoor-oidc
spec:
  dependsOn:
    - name: kanidm-provision
      namespace: security
  healthChecks:
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmOAuth2Client
      name: tandoor
      namespace: default
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmOAuth2Client
      current: status.ready
  interval: 1h
  path: ./kubernetes/apps/default/tandoor/oidc
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tandoor
  namespace: flux-system
spec:
  targetNamespace: default
  components:
    - ../../../../components/kopiur
    - ../../../../components/postgres
  dependsOn:
    - name: crunchy-postgres-operator
      namespace: database
    - name: tandoor-oidc
      namespace: default
  path: ./kubernetes/apps/default/tandoor/app
  healthCheckExprs:
    - apiVersion: postgres-operator.crunchydata.com/v1beta1
      kind: PostgresCluster
      failed: status.conditions.filter(e, e.type == 'ProxyAvailable').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'ProxyAvailable').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      GATUS_SUBDOMAIN: recipes
      USERNAME: recipes
      DATABASES: '["recipes_db"]'
