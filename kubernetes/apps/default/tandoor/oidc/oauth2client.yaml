---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: tandoor
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: Tandoor
  origin: https://recipes.franta.us
  redirectUrl:
    - https://recipes.franta.us/accounts/oidc/kanidm/login/callback/
  scopeMap:
    - group: people
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
