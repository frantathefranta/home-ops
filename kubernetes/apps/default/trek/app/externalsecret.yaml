---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secret
spec:
  refreshInterval: 15m
  target:
    name: trek-secret
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_SECRET: '{{ .TREK_OAUTH_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        key: /trek
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: akeyless-secret-store
