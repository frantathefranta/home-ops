---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-secret
spec:
  refreshInterval: 15m
  target:
    name: konflate-secret
    template:
      engineVersion: v2
      data:
        KONFLATE_APP_CLIENT_ID: "{{ .GITHUB_APP_ID_B64 }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY_B64 }}"
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
  dataFrom:
    - extract:
        key: /konflate
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: akeyless-secret-store
    - extract:
        # Reuses the GitHub App backing the actions runners; Auto decodes the
        # _B64 properties (the PEM is base64 in Akeyless because it's unwieldy raw)
        key: /github
        decodingStrategy: Auto
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: akeyless-secret-store