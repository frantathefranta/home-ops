---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: konflate
  values:
    config:
      mcp: true
      prComments: true
      publicUrl: https://konflate.franta.us
      repo: github://frantathefranta/home-ops
      statusChecks: true
      verifyImages: true
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.franta.us"
      parentRefs:
        - name: external
          namespace: kube-system
          sectionName: https
    secret:
      existingSecret: konflate-secret
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 2Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-staging
  annotations:
    external-dns.kubernetes.io/controller: none
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - konflate.franta.us
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: konflate
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
