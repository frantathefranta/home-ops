---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: konflate
  values:
    config:
      mcp: true
      prComments: true
      publicUrl: https://konflate.franta.us
      repo: github://frantathefranta/home-ops
      statusChecks: true
      verifyImages: true
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.franta.us"
      parentRefs:
        - name: external
          namespace: kube-system
          sectionName: https
    secret:
      existingSecret: konflate-secret