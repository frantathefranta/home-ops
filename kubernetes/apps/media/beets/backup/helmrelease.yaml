---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beets-backup
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: beets-backup
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph-external
  values:
    externalSecrets:
      main:
        forceRename: beets-secret
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: beets-secret
          template:
            engineVersion: v2
            data:
              B2_ACCOUNT_ID: '{{ .B2_ACCOUNT_ID }}'
              B2_ACCOUNT_KEY: '{{ .B2_ACCOUNT_KEY }}'
              RESTIC_REPOSITORY: '{{ .MUSIC_BUCKET }}'
              RESTIC_PASSWORD: '{{ .MUSIC_BUCKET_PASSWORD }}'
        dataFrom:
        - extract:
            key: /beets
    controllers:
      beets-backup:
        type: cronjob
        cronjob:
          schedule: "@daily"
          timeZone: America/Detroit
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: ghcr.io/restic/restic
              tag: 0.20.0@sha256:ccb3af1abb107769156f339823d746722eba67bed2d0590a775a566ae7fc2454
            envFrom:
            - secretRef:
                name: beets-secret
            command:
              - /bin/sh
              - -c
              - |
                restic backup --verbose /music/stereo --group-by 'paths' && restic forget --keep-daily 1 --keep-weekly 1 --keep-monthly 6 --prune --group-by 'paths'
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                cpu: 1000m
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 1003
        fsGroup: 1003
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }

    persistence:
      music:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/music
        globalMounts:
        - path: /music
      tmp:
        type: emptyDir
      cache:
        existingClaim: beets-restic-cache
        globalMounts:
          - path: /.cache
