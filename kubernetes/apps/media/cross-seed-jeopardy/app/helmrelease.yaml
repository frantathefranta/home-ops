---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cross-seed-jeopardy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cross-seed-jeopardy
  dependsOn:
    - name: transmission-jeopardy
      namespace: media
  values:
    externalSecrets:
      main:
        forceRename: cross-seed-jeopardy-secret
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: cross-seed-jeopardy-secret
          template:
            engineVersion: v2
            data:
              CROSS_SEED_API_KEY: '{{ .CROSS_SEED_JEOPARDY_API_KEY }}'
              config.js: |
                module.exports = {
                  action: "inject",
                  apiKey: "{{.CROSS_SEED_JEOPARDY_API_KEY}}",
                  delay: 30,
                  duplicateCategories: false,
                  flatLinking: false,
                  includeEpisodes: true,
                  includeNonVideos: false,
                  includeSingleEpisodes: true,
                  linkCategory: "cross-seed",
                  linkDirs: [
                    "/jeopardy/downloads/cross-seed"
                  ],
                  linkType: "hardlink",
                  matchMode: "safe",
                  outputDir: null,
                  torrentClients: [
                    "transmission:http://transmission-jeopardy.media.svc.cluster.local:9091/transmission/rpc",
                  ],
                  port: Number(process.env.CROSS_SEED_PORT),
                  skipRecheck: true,
                  sonarr: [
                    "http://sonarr.media.svc.cluster.local/?apikey={{ .SONARR_API_KEY }}"
                  ],
                  torznab: [],
                  useClientTorrents: true
                };
        dataFrom:
        - extract:
            key: /cross-seed
        - extract:
            key: /sonarr
    controllers:
      cross-seed-jeopardy:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 1003
            runAsNonRoot: true
            fsGroup: 1003
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.7@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225
            env:
              CROSS_SEED_PORT: &port 2468
              TZ: America/Detroit
            args:
              - daemon
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ipFamilyPolicy: RequireDualStack
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: *app
      config-file:
        type: secret
        name: cross-seed-jeopardy-secret
        globalMounts:
          - path: /config/config.js
            subPath: config.js
            readOnly: true
      jeopardy:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/jeopardy
        globalMounts:
          - path: /jeopardy
            # subPath: jeopardy
