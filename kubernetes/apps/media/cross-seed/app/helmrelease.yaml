---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cross-seed
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cross-seed
  dependsOn:
    - name: qbittorrent
      namespace: media
    - name: prowlarr
      namespace: media
  values:
    externalSecrets:
      main:
        forceRename: cross-seed-secret
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: cross-seed-secret
          template:
            engineVersion: v2
            data:
              config.js: |
                module.exports = {
                  action: "inject",
                  apiKey: "{{.CROSS_SEED_API_KEY}}",
                  duplicateCategories: true,
                  flatLinking: false,
                  includeNonVideos: true,
                  includeEpisodes: true,
                  includeSingleEpisodes: true,
                  linkCategory: "cross-seed",
                  linkType: "hardlink",
                  linkDirs: [
                    "/media/downloads/xseed"
                    ],
                  matchMode: "safe",
                  outputDir: null,
                  torrentClients: [
                    "qbittorrent:http://qbittorrent.media.svc.cluster.local:8080",
                  ],
                  radarr: [
                    "http://radarr.media.svc.cluster.local/?apikey={{ .RADARR_API_KEY }}"
                  ],
                  skipRecheck: true,
                  searchCadence: "1 day",
                  excludeRecentSearch: "90 days",
                  excludeOlder: "450 days",
                  sonarr: [
                    "http://sonarr.media.svc.cluster.local/?apikey={{ .SONARR_API_KEY }}"
                  ],
                  torznab: [
                    `http://prowlarr.media.svc.cluster.local:80/2/api?apikey={{ .PROWLARR_API_KEY }}`, // BHD
                    `http://prowlarr.media.svc.cluster.local:80/60/api?apikey={{ .PROWLARR_API_KEY }}`, // HDB
                    `http://prowlarr.media.svc.cluster.local:80/68/api?apikey={{ .PROWLARR_API_KEY }}`, // PTP
                    `http://prowlarr.media.svc.cluster.local:80/66/api?apikey={{ .PROWLARR_API_KEY }}` // BTN
                  ],
                  useClientTorrents: true
                };
        dataFrom:
        - extract:
            key: /cross-seed
        - extract:
            key: /prowlarr
        - extract:
            key: /sonarr
        - extract:
            key: /radarr
    controllers:
      cross-seed:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.7@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225
            env:
              CROSS_SEED_PORT: &port 2468
              TZ: America/Detroit
            args:
              - daemon
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: *app
        ipFamilyPolicy: RequireDualStack
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: *app
      config-cross-seeds:
        type: emptyDir
        globalMounts:
          - path: /config/cross-seeds
      config-file:
        type: secret
        name: cross-seed-secret
        globalMounts:
          - path: /config/config.js
            subPath: config.js
            readOnly: true
      media:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/media
        globalMounts:
          - path: /media
            # subPath: media
