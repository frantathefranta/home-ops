---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kometa
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
  values:
    externalSecrets:
      main:
        forceRename: kometa-secret
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: kometa-secret
          template:
            data:
              KOMETA_MDBLIST_API_KEY: '{{ .MDBLIST_API_KEY }}'
              KOMETA_OMDB_API_KEY: '{{ .OMDB_API_KEY }}'
              KOMETA_PLEX_API_KEY: '{{ .PLEX_TOKEN }}'
              KOMETA_RADARR_API_KEY: '{{ .RADARR_API_KEY }}'
              KOMETA_SONARR_API_KEY: '{{ .SONARR_API_KEY }}'
              KOMETA_TAUTULLI_API_KEY: '{{ .TAUTULLI_API_KEY }}'
              KOMETA_TMDB_API_KEY: '{{ .TMDB_API_KEY }}'
              # KOMETA_TRAKT_ACCESS_TOKEN: "{{ .TRAKT_ACCESS_TOKEN }}"
              # KOMETA_TRAKT_CREATED_AT: "{{ .TRAKT_CREATED_AT }}"
              # KOMETA_TRAKT_CLIENT_ID: "{{ .TRAKT_CLIENT_ID }}"
              # KOMETA_TRAKT_CLIENT_SECRET: "{{ .TRAKT_CLIENT_SECRET }}"
              # KOMETA_TRAKT_EXPIRES_IN: "{{ .TRAKT_EXPIRES_IN }}"
              # KOMETA_TRAKT_REFRESH_TOKEN: "{{ .TRAKT_REFRESH_TOKEN }}"
        dataFrom:
        - extract:
            key: kometa
        - extract:
            key: plex
        - extract:
            key: tautulli
        - extract:
            key: radarr
        - extract:
            key: sonarr
    controllers:
      kometa:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          schedule: "@daily"
          timeZone: &timeZone America/Detroit
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: kometateam/kometa
              tag: v2.4.8@sha256:c58f6d4af511613f218b6dafbfc84078af4e5a6089790c1fdba58fd7c5dad70a
            command:
              - /bin/sh
              - -c
            # args:
            #   - |
            #     python3 kometa.py --run --read-only-config --run-libraries "Anime";
            #     python3 kometa.py --run --read-only-config --run-libraries "Movies";
            #     python3 kometa.py --run --read-only-config --run-libraries "TV programmes";
            args:
              - |
                python3 kometa.py --run --read-only-config --run-libraries "Movies";
                python3 kometa.py --run --read-only-config --run-libraries "TV programmes";
            env:
              TZ: *timeZone
            envFrom:
              - secretRef:
                  name: kometa-secret
            resources:
              requests:
                cpu: 10m
                memory: 4096M
              limits:
                memory: 8192M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: *app
      config-file:
        type: configMap
        name: kometa-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
