---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent-music
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      qbittorrent-music:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1003
            fsGroup: 1003
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [10000]
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          gazelle-origin:
            image: &image
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
            command:
              - /bin/sh
              - -ec
            args:
              - |
                # Reuse the app's Python/musl; new pods need GitHub/PyPI access.
                python3 -m venv --without-pip /opt/gazelle-origin
                python3 -m pip --python /opt/gazelle-origin install \
                  --disable-pip-version-check --no-cache-dir \
                  --requirement /bootstrap/requirements.txt
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            env:
              TZ: America/Detroit
              QBT_WEBUI_PORT: &port 8080
              QBT_TORRENTING_PORT: &peerPort 18904
            envFrom:
              - secretRef:
                  name: qbittorrent-music-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
              startup:
                <<: *probes
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
            securityContext: *securityContext
          nemorosa:
            image:
              repository: ghcr.io/kyokomiki/nemorosa
              tag: 0.5.1@sha256:cc0f7be1dd92277d2f6c82d96e8d772bb73ead75b79590fc51f32430ddeae9d4
            args:
              - --server
              - --config
              - /etc/nemorosa/config.yml
            env:
              TZ: America/Detroit
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext: *securityContext
    externalSecrets:
      secret:
        secretStoreRef: &secretStoreRef
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: qbittorrent-music-secret
          template:
            engineVersion: v2
            data:
              RED_API_KEY: '{{ .RED_API_KEY }}'
              OPS_API_KEY: '{{ .OPS_API_KEY }}'
              WRTAG_API_KEY: '{{ .WRTAG_API_KEY }}'
              NEMOROSA_API_KEY: '{{ .NEMOROSA_API_KEY }}'
        dataFrom:
          - extract:
              key: /varroa
          - extract:
              key: /wrtag
          - extract:
              key: /nemorosa
      nemorosa:
        secretStoreRef: *secretStoreRef
        refreshInterval: 15m
        target:
          name: qbittorrent-music-nemorosa
          template:
            engineVersion: v2
            data:
              config.yml: |
                global:
                  loglevel: debug
                  exclude_mp3: true
                  check_trackers:
                    - "flacsfor.me"
                    - "home.opsfet.ch"
                  check_music_only: true
                  auto_start_torrents: true

                linking:
                  enable_linking: true
                  link_dirs:
                    - "/music/downloads/nemorosa-qbittorrent"
                  link_type: "hardlink"

                server:
                  host: "127.0.0.1"
                  port: 8256
                  api_key: "{{ .NEMOROSA_API_KEY }}"
                  search_cadence: "1 day"
                  cleanup_cadence: "1 day"

                downloader:
                  - type: "qbittorrent"
                    url: "http://127.0.0.1:8080"
                    label: "nemorosa"

                target_site:
                  - server: "https://redacted.sh"
                    api_key: "{{ .RED_API_KEY }}"
                  - server: "https://orpheus.network"
                    api_key: "{{ .OPS_API_KEY }}"
        dataFrom:
          - extract:
              key: /nemorosa
          - extract:
              key: /varroa
    networkpolicies:
      allow-ingress:
        type: cilium
        controller: *app
        ingress:
          - fromEntities:
              - world
            toPorts:
              - ports:
                  - port: "18904"
                    protocol: TCP
    persistence:
      bootstrap:
        type: configMap
        name: qbittorrent-music-bootstrap
        advancedMounts:
          qbittorrent-music:
            gazelle-origin:
              - path: /bootstrap/requirements.txt
                subPath: requirements.txt
                readOnly: true
      config:
        existingClaim: *app
        advancedMounts:
          qbittorrent-music:
            app:
              - path: /config
      gazelle-origin:
        type: emptyDir
        advancedMounts:
          qbittorrent-music:
            gazelle-origin:
              - path: /opt/gazelle-origin
            app:
              - path: /opt/gazelle-origin
                readOnly: true
              # Add the CLI without shadowing the app's system Python.
              - path: /usr/local/bin/gazelle-origin
                subPath: bin/gazelle-origin
                readOnly: true
      music:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/music
        advancedMounts:
          qbittorrent-music:
            app:
              - path: /music
            nemorosa:
              - path: /music
      nemorosa:
        existingClaim: qbittorrent-music-nemorosa
        advancedMounts:
          qbittorrent-music:
            nemorosa:
              - path: /app/data
      nemorosa-config:
        type: secret
        name: qbittorrent-music-nemorosa
        advancedMounts:
          qbittorrent-music:
            nemorosa:
              - path: /etc/nemorosa
                readOnly: true
      scripts:
        type: configMap
        name: qbittorrent-music-scripts
        defaultMode: 0755
        advancedMounts:
          qbittorrent-music:
            app:
              - path: /scripts
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          qbittorrent-music:
            gazelle-origin:
              - path: /tmp
            app:
              - path: /tmp
    route:
      app:
        hostnames:
          - qbittorrent-music.franta.us
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
      bittorrent:
        type: LoadBalancer
        ipFamilyPolicy: RequireDualStack
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 10.33.40.67,${CLUSTER_LBA_V6_PREFIX}:67
        ports:
          bittorrent:
            port: *peerPort
            protocol: TCP
