---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
spec:
  targetNamespace: media
  components:
    - ../../../../components/postgres
  dependsOn:
    - name: crunchy-postgres-operator
      namespace: database
  healthCheckExprs:
    - apiVersion: postgres-operator.crunchydata.com/v1beta1
      kind: PostgresCluster
      failed: status.conditions.filter(e, e.type == 'ProxyAvailable').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'ProxyAvailable').all(e, e.status == 'True')
  patches:
    - target:
        group: postgres-operator.crunchydata.com
        version: v1beta1
        kind: PostgresCluster
      patch: |-
        - op: add
          path: /metadata/annotations
          value:
            postgres-operator.crunchydata.com/allow-upgrade: radarr-17-to-18
        - op: add
          path: /spec/shutdown
          value: true
  path: ./kubernetes/apps/media/radarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  postBuild:
    substitute:
      APP: *app
