---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rtorrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      rtorrent:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The upstream s6 init configures nginx/PHP and drops services to PUID/PGID.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 1003
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [10000]
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 120
        # Build per pod with the app's Python/musl; startup needs GitHub/PyPI access.
        initContainers:
          gazelle-origin:
            image: &rtorrentImage
              repository: ghcr.io/crazy-max/rtorrent-rutorrent
              tag: 5.3.25-0.16.28@sha256:66f0bcc17bc3d6b41d4db6fdc1ca7243a74f63326bf3073764cf17637b771c74
            command:
              - /bin/sh
              - -ec
            args:
              - |
                python3 -m venv --without-pip /opt/gazelle-origin
                python3 -m pip --python /opt/gazelle-origin install \
                  --disable-pip-version-check --no-cache-dir \
                  --requirement /config/requirements.txt
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1003
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *rtorrentImage
            env:
              TZ: America/Detroit
              PUID: "1000"
              PGID: "1003"
              RUTORRENT_PORT: &port 8080
              XMLRPC_PORT: &rpcPort 8000
              RT_INC_PORT: &peerPort 50000
              RT_SESSION_SAVE_SECONDS: "300"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/healthcheck
                  periodSeconds: 30
                  timeoutSeconds: 20
                  failureThreshold: 3
              readiness: *probes
              startup:
                <<: *probes
                spec:
                  exec:
                    command:
                      - /usr/local/bin/healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 20
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
    networkpolicies:
      allow-ingress:
        type: cilium
        controller: rtorrent
        ingress:
          - fromEntities:
              - world
            toPorts:
              - ports:
                  - port: "50000"
                    protocol: TCP
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          rtorrent:
            app:
              - path: /data
                subPath: data
              - path: /passwd
                subPath: passwd
      gazelle-origin:
        type: emptyDir
        advancedMounts:
          rtorrent:
            gazelle-origin:
              - path: /opt/gazelle-origin
            app:
              - path: /opt/gazelle-origin
                readOnly: true
              # Expose only the CLI, without shadowing ruTorrent's system Python.
              - path: /usr/local/bin/gazelle-origin
                subPath: bin/gazelle-origin
                readOnly: true
      gazelle-origin-config:
        type: configMap
        name: rtorrent-gazelle-origin
        advancedMounts:
          rtorrent:
            gazelle-origin:
              - path: /config/requirements.txt
                subPath: requirements.txt
                readOnly: true
      media:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/music
        advancedMounts:
          rtorrent:
            app:
              - path: /music
              # Default downloads land in temp/ and complete/ under the existing share.
              # The watch directory stays on /data, separate from Transmission's watch.
              - path: /downloads
                subPath: downloads
      tmp:
        type: emptyDir
        advancedMounts:
          rtorrent:
            gazelle-origin:
              - path: /tmp
    route:
      app:
        hostnames:
          - rtorrent.franta.us
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
          # XMLRPC is cluster-only; WebDAV and health ports are not exposed.
          xmlrpc:
            port: *rpcPort
      bittorrent:
        type: LoadBalancer
        ipFamilyPolicy: RequireDualStack
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 10.33.40.66,${CLUSTER_LBA_V6_PREFIX}:66
        ports:
          bittorrent:
            port: *peerPort
            protocol: TCP
