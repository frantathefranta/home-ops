---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: sonarr
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: Sonarr
  origin: https://sonarr.franta.us
  redirectUrl:
    - https://sonarr.franta.us/signin-oidc
  scopeMap:
    - group: media
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
