---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app transmission-jeopardy
spec:
  targetNamespace: media
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur
    - ../../../../components/zeroscaler
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/transmission/jeopardy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: transmission-jeopardy-migrated
      KOPIUR_CAPACITY: 2Gi
      VOLSYNC_CAPACITY: 2Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app transmission-music
spec:
  targetNamespace: media
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur
    - ../../../../components/zeroscaler
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: wrtag
      namespace: media
  path: ./kubernetes/apps/media/transmission/music
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: transmission-music-migrated
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1003"
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1003"
