---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app transmission-music
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: transmission-music
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph-external
  values:
    externalSecrets:
      secret:
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: transmission-music-secret
          template:
            engineVersion: v2
            data:
              RED_API_KEY: '{{ .RED_API_KEY }}'
              OPS_API_KEY: '{{ .OPS_API_KEY }}'
              WRTAG_API_KEY: '{{ .WRTAG_API_KEY }}'
              NEMOROSA_API_KEY: '{{ .NEMOROSA_API_KEY }}'
        dataFrom:
        - extract:
            key: /varroa
        - extract:
            key: /wrtag
        - extract:
            key: /nemorosa
      nemorosa:
        forceRename: nemorosa-secret
        secretStoreRef:
          name: akeyless-secret-store
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: nemorosa-secret
          template:
            engineVersion: v2
            data:
              config.yml: |
                global:
                  # Global settings
                  loglevel: debug
                  no_download: false
                  exclude_mp3: true
                  check_trackers:
                    - "flacsfor.me"
                    - "home.opsfet.ch"
                  check_music_only: true
                  auto_start_torrents: true

                linking:
                  # File linking configuration
                  enable_linking: true
                  link_dirs:
                    - "/music/downloads/nemorosa"
                  link_type: "hardlink"

                server:
                  # Web server settings
                  host: null # Means 0.0.0.0 and ::
                  port: 8256
                  api_key: "{{ .NEMOROSA_API_KEY }}"
                  search_cadence: "1 day"
                  cleanup_cadence: "1 day"

                downloader:
                  # Torrent client settings
                  - type: "transmission"
                    url: "http://transmission-music.media.svc.cluster.local:9091/transmission/rpc"
                    torrents_dir: "/config/torrents"
                    label: "nemorosa"

                target_site:
                  # Target tracker settings
                  - server: "https://redacted.sh"
                    api_key: "{{ .RED_API_KEY }}"
                  - server: "https://orpheus.network"
                    api_key: "{{ .OPS_API_KEY }}"
        dataFrom:
        - extract:
            key: /nemorosa
        - extract:
            key: /varroa
    networkpolicies:
      allow-ingress:
        forceRename: transmission-music-allow-ingress
        type: cilium
        controller: transmission
        ingress:
        - fromEntities:
          - world
    controllers:
      transmission:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/frantathefranta/transmission
              tag: 4.1.3@sha256:97a6ab985f34ca7343e781b05f0b48cf40120e58163096d958dead9f840e5ef8
            env:
              TZ: America/Detroit
              TRANSMISSION__BLOCKLIST_URL: "https://mirror.codebucket.de/transmission/blocklist.p2p.gz"
              TRANSMISSION__DOWNLOAD_DIR: "/music/downloads"
              TRANSMISSION__INCOMPLETE_DIR_ENABLED: false
              TRANSMISSION__RPC_BIND_ADDRESS: "::"
              TRANSMISSION__RPC_PORT: &port 9091
              TRANSMISSION__RPC_WHITELIST: "10.*.*.*"
              TRANSMISSION__RPC_WHITELIST_ENABLED: false
              TRANSMISSION__RPC_HOST_WHITELIST_ENABLED: false
              TRANSMISSION__PEER_PORT: &peerport 51414
              TRANSMISSION__RATIO_LIMIT_ENABLED: false
              TRANSMISSION__UTP_ENABLED: false
              TRANSMISSION__UMASK: 7
              TRANSMISSION__MESSAGE_LEVEL: 3
              TRANSMISSION__WATCH_DIR_ENABLED: true
              TRANSMISSION__WATCH_DIR: "/music/downloads/watch"
              TRANSMISSION__WATCH_FORCE_GENERIC: true
              TRANSMISSION__SCRIPT_TORRENT_DONE_ENABLED: true
              TRANSMISSION__SCRIPT_TORRENT_DONE_FILENAME: /scripts/transmission-complete.sh
            envFrom:
              - secretRef:
                  name: transmission-music-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /transmission/web/
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /transmission/web/
                    port: *port
                  failureThreshold: 50
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
          nemorosa:
            image:
              repository: ghcr.io/kyokomiki/nemorosa
              tag: 0.5.1@sha256:cc0f7be1dd92277d2f6c82d96e8d772bb73ead75b79590fc51f32430ddeae9d4
            args:
              - --server
            env:
              TZ: America/Detroit
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: true
            #   capabilities:
            #     drop:
            #       - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1003
        fsGroup: 1003
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: transmission
        type: LoadBalancer
        ipFamilyPolicy: RequireDualStack
        annotations:
          lbipam.cilium.io/ips: 10.33.40.65,${CLUSTER_LBA_V6_PREFIX}:65
        ports:
          http:
            port: *port
            primary: true
          bittorrent:
            enabled: true
            port: *peerport
            protocol: TCP
          nemorosa:
            port: &nemorosaPort 8256

      # nemorosa:
      #   controller: transmission
      #   ports:
      #     http:
      #       port: &nemorosaPort 8256

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.franta.us"
          - tm.franta.us
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: transmission-music
                port: *port
      nemorosa:
        hostnames:
          - nemorosa.franta.us
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: transmission-music
                port: *nemorosaPort
    persistence:
      config:
        existingClaim: *app
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: ${NAS_IP}
        path: /emc1/music
        globalMounts:
          - path: /music
      nemorosa:
        existingClaim: nemorosa
        advancedMounts:
          transmission:
            nemorosa:
              - path: /app/data
      nemorosa-config-file:
        type: secret
        name: nemorosa-secret
        advancedMounts:
          transmission:
            nemorosa:
              - path: /app/data/nemorosa/config.yml
                subPath: config.yml
                readOnly: true
      scripts:
        type: configMap
        name: transmission-music-scripts
        defaultMode: 0755
        globalMounts:
          - path: /scripts
