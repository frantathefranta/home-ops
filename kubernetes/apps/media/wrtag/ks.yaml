---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wrtag
spec:
  targetNamespace: media
  components:
    - ../../../../components/kopiur
    - ../../../../components/zeroscaler
  path: ./kubernetes/apps/media/wrtag/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1003"
