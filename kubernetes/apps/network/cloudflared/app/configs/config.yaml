---
originRequest:
  originServerName: "ingress-external.franta.us"

ingress:
  - hostname: "git.franta.us"
    service: http_status:404
  - hostname: "franta.us"
    service: &svc https://envoy-external.network.svc.cluster.local:443
  - hostname: "*.franta.us"
    service: *svc
  - service: http_status:404
