---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app multus
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: multus
  values:
    # Keep the existing Flux-managed ServiceAccount and RBAC during the chart switch.
    serviceAccount:
      create: false
      name: multus
    rbac:
      create: false
    podAnnotations:
      reloader.stakater.com/auto: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: special
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/assignment
        value: intel-gpu
        operator: Equal
        effect: NoSchedule
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
