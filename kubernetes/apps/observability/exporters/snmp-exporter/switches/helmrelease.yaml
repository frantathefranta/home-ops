---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snmp-exporter-switches
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: snmp-exporter
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  values:
    fullnameOverride: *app
    extraArgs: ["--config.file=/config/snmp.yaml"]
    extraConfigmapMounts:
      - name: &name switches-snmp-configmap
        mountPath: /config/snmp.yaml
        subPath: snmp.yaml
        configMap: *name
        readOnly: true
        defaultMode: 420
    podAnnotations:
      configmap.reloader.stakater.com/reload: *name
    serviceMonitor:
      enabled: true
      params:
        - name: arista01
          module: ["arista_resources", "arista_sensors", "if_mib", "system"]
          target: arista.infra.franta.us
          auth: ["network_v2"]
        - name: brocade-garage
          module: ["if_mib", "system"]
          target: brocade-garage.infra.franta.us
          auth: ["network_v2"]
        - name: brocade01
          module: ["if_mib", "system"]
          target: 10.32.10.202 # TODO: Figure out why this switch doesn't get scraped over IPv6
          auth: ["network_v2"]
      path: /snmp
      scrapeTimeout: 15s
      relabelings:
        - { sourceLabels: ["__param_target"], targetLabel: instance }
