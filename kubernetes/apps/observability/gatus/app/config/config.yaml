---
web:
  port: ${WEB_PORT}
storage:
  type: postgres
  path: ${POSTGRES_URI}?sslmode=require
  caching: true
metrics: true
ui:
  title: Talos-Maxi Status
  header: Talos-Maxi Status
  logo: https://raw.githubusercontent.com/frantathefranta/hugoblog/master/static/android-chrome-512x512.png
alerting:
  pushover:
    application-token: ${GATUS_PUSHOVER_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    default-alert:
      description: health-check failed
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3
endpoints:
  - name: status
    group: external
    url: https://status.franta.us
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover
  - name: cloudflare-ipv4
    group: connectivity
    url: tcp://1.1.1.1:53
    interval: 1m
    client:
      timeout: 5s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover
  - name: cloudflare-ipv6
    group: connectivity
    url: tcp://[2606:4700:4700::1111]:53
    interval: 1m
    client:
      timeout: 5s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover
  - name: google-ipv6
    group: connectivity
    url: tcp://[2001:4860:4860::8888]:53
    interval: 1m
    client:
      timeout: 5s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: pushover
