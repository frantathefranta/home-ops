---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: grafana
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: Grafana
  origin: https://grafana.franta.us
  redirectUrl:
    - https://grafana.franta.us/login/generic_oauth
  scopeMap:
    - group: people
      scopes:
        - openid
        - profile
        - email
  preferShortUsername: true
