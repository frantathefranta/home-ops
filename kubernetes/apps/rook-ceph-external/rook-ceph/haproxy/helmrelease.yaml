---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app haproxy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: haproxy
  values:
    controllers:
      haproxy:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          configmap.reloader.stakater.com/reload: &configmap haproxy-config
        containers:
          app:
            image:
              repository: ghcr.io/haproxytech/haproxy-docker-alpine
              tag: 3.4.4@sha256:d7575dd23b16ce58a2331df535c9df1555342c06f5b8fc481ebf159bc8f1e610
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8404
                    path: /
              readiness: *probes
    service:
      rados-gw:
        controller: haproxy
        ports:
          http:
            port: &port 7480
          metrics:
            port: 8405
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        hostnames:
          - "rgw.franta.us"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: haproxy
                port: *port
    persistence:
      config:
        type: configMap
        name: *configmap
        advancedMounts:
          haproxy:
            app:
              - path: /usr/local/etc/haproxy/haproxy.cfg
                subPath: haproxy.cfg
      tmp:
        type: emptyDir
