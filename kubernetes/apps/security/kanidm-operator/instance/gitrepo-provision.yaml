---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kanidm-provision
  namespace: security
spec:
  interval: 1h
  ref:
    branch: main
  secretRef:
    name: kanidm-provision-git
  url: ssh://git@git.franta.us/franta/kanidm-provision.git
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-provision
spec:
  interval: 1h
  postBuild:
    substituteFrom:
      - kind: Secret
        name: kanidm-identity-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: kanidm-provision
