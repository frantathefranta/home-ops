---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-kanidm-provision
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: kanidm-provision-git
    template:
      type: Opaque
      engineVersion: v2
      data:
        identity: "{{ .privateKey }}"
        known_hosts: "git.franta.us ssh-rsa "
  data:
    - secretKey: privateKey
      remoteRef:
        key: /kanidm
        property: privateKey
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kanidm-provision
  namespace: security
spec:
  interval: 1h
  ref:
    branch: main
  secretRef:
    name: kanidm-provision-git
  url: ssh://git@git.franta.us/franta/kanidm-provision.git
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-provision
spec:
  interval: 1h
  postBuild:
    substituteFrom:
      - kind: Secret
        name: kanidm-identity-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: kanidm-provision
