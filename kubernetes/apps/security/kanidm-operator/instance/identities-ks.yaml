---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-identities
spec:
  dependsOn:
    - name: kanidm-instance
      namespace: security
  healthChecks:
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmPersonAccount
      name: franta
      namespace: security
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmPersonAccount
      name: cara
      namespace: security
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmGroup
      name: trek-users
      namespace: security
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmPersonAccount
      current: status.ready && status.credentialState == 'present' && status.conditions.exists(c, c.type == 'Valid' && c.status == 'True')
    - apiVersion: kaniop.rs/v1beta1
      kind: KanidmGroup
      current: status.ready
  interval: 1h
  path: ./
  postBuild:
    substituteFrom:
      - kind: Secret
        name: kanidm-identity-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: kanidm-provision
    namespace: security
  targetNamespace: security
