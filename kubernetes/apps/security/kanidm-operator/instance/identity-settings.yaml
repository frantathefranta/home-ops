---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-identity-settings
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: kanidm-identity-settings
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: KANIDM_FRANTA_EMAIL
      remoteRef:
        key: /glauth
        property: GLAUTH_FRANTA_EMAIL
    - secretKey: KANIDM_CARA_EMAIL
      remoteRef:
        key: /glauth
        property: GLAUTH_CARA_EMAIL
