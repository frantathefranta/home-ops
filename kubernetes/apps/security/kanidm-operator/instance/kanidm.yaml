---
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: sso
spec:
  domain: sso.franta.us
  origin: https://sso.franta.us
  image: docker.io/kanidm/server:1.12.0@sha256:71b6ff5a9c9c32b632894d8acef5a2afc77941b35a0aa95dcee959fe688d5ce9
  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi
  groupNamespaceSelector: {}
  oauth2ClientNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: ceph-rbd
  tlsSecretName: sso-franta-us-tls
  gateway:
    parentRefs:
      - name: envoy-external
        namespace: network
    hostnames:
      - sso.franta.us
    backendTlsPolicy:
      validation:
        hostname: sso.franta.us
        wellKnownCaCertificates: System
