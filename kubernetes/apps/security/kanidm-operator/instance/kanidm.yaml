---
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: sso
spec:
  domain: sso.franta.us
  origin: https://sso.franta.us
  image: docker.io/kanidm/server:1.11.2@sha256:e45f00bd354c1fc1c06a4be484b4e87b094c431e78280f1d19e911815e63efb5
  logLevel: info
  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 512Mi
  groupNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: security
  personNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: security
  serviceAccountNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: security
  oauth2ClientNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: ceph-rbd
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  securityContext:
    runAsNonRoot: true
    runAsUser: 389
    runAsGroup: 389
    fsGroup: 389
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kanidm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  initContainers:
    - name: kanidm-generate-replication-config
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  # Native Kanidm logical backups remain on the same PVC as the database.
  # Kopiur independently copies CSI snapshots to the existing Garage repository.
  # These variables are supported by the pinned server; no experimental
  # Kaniop remote transport or additional backup credentials are needed.
  env:
    - name: KANIDM_ONLINE_BACKUP_PATH
      value: /data/backups
    - name: KANIDM_ONLINE_BACKUP_SCHEDULE
      value: "0 2 * * *"
    - name: KANIDM_ONLINE_BACKUP_VERSIONS
      value: "7"
  tlsSecretName: sso-franta-us-tls
  gateway:
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    hostnames:
      - sso.franta.us
    backendTlsPolicy:
      validation:
        hostname: sso.franta.us
        wellKnownCaCertificates: System
