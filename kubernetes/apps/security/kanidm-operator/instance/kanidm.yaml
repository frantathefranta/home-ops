---
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: sso
spec:
  domain: sso.franta.us
  origin: https://sso.franta.us
  image: docker.io/kanidm/server:1.12.1@sha256:77198131f28116203e105d2e42214203757d113a694f35de545669e75db5c96f
  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi
  groupNamespaceSelector: {}
  oauth2ClientNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: ceph-rbd
  tlsSecretName: sso-franta-us-tls
  gateway:
    parentRefs:
      - name: envoy-external
        namespace: network
    hostnames:
      - sso.franta.us
    backendTlsPolicy:
      validation:
        hostname: sso.franta.us
        wellKnownCaCertificates: System

  ipFamily: ipv6
