---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sso-admin
spec:
  secretStoreRefs:
    - name: akeyless-secret-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: sso-admin-passwords
  data:
    - match:
        secretKey: ADMIN_USERNAME
        remoteRef:
          remoteKey: /kanidm/admin
          property: ADMIN_USERNAME
    - match:
        secretKey: ADMIN_PASSWORD
        remoteRef:
          remoteKey: /kanidm/admin
          property: ADMIN_PASSWORD
    - match:
        secretKey: IDM_ADMIN_USERNAME
        remoteRef:
          remoteKey: /kanidm/admin
          property: IDM_ADMIN_USERNAME
    - match:
        secretKey: IDM_ADMIN_PASSWORD
        remoteRef:
          remoteKey: /kanidm/admin
          property: IDM_ADMIN_PASSWORD
