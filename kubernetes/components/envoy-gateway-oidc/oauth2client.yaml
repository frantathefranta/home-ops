---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: ${APP}
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: ${APP}
  origin: https://${APP_SUBDOMAIN:-${APP}}.franta.us
  redirectUrl:
    - https://${APP_SUBDOMAIN:-${APP}}.franta.us/oauth2/callback
  scopeMap:
    - group: people
      scopes:
        - openid
        - profile
        - email